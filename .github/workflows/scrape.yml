name: Scraping Masivo de Ofertas

on:
  schedule:
    # Corre cada 30 minutos
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Permite correr el workflow manualmente desde la interfaz de GitHub

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para hacer commit de la base de datos actualizada

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Es importante hacer fetch depth 0 si hubiese conflictos de historial
          fetch-depth: 1 

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Actualizado a Node 24 para evitar advertencias
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Scraping Masivo (Hasta 50 páginas)
        run: npm run scrape

      - name: Hacer commit y push de la Base de Datos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add src/data/productos-db.json
          
          # Solo hacer commit si hubo cambios en el archivo
          if git diff-index --quiet HEAD --; then
            echo "No se encontraron ofertas nuevas o cambios."
          else
            git commit -m "chore: actualización automática de la base de datos de zapatillas"
            git push
          fi
